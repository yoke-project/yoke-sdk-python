# The Python family: a base and the libraries over it. Nothing is published before 0.3, which names the
# package; until then it is source only.
[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "yoke-sdk"
version = "0.0.0"
description = "The Python libraries of Yoke"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = ["yoke-proto==0.1.0", "grpcio>=1.84.0"]
classifiers = ["Private :: Do Not Upload"]

[project.scripts]
yoke-python-plugin-harness = "yoke_sdk.harness:main"

[tool.hatch.build.targets.wheel]
packages = ["src/yoke_sdk"]
