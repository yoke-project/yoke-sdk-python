# The Python interface library's harness, which the conformance suite drives. It is a project of its own so
# the wheel yoke-sdk never carries it, and it is never uploaded.
[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "yoke-python-interface-harness"
version = "0.0.0"
description = "The Python interface library's harness, which the conformance suite drives"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["yoke-sdk"]
classifiers = ["Private :: Do Not Upload"]

[project.scripts]
yoke-python-interface-harness = "yoke_sdk_interface_harness:main"

[tool.hatch.build.targets.wheel]
packages = ["src/yoke_sdk_interface_harness"]
